<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agora — Buy & sell things worth keeping</title>
  <meta name="description" content="Agora is a curated marketplace to buy and sell pre-loved and new items: furniture, fashion, tech, cameras, watches and more." />
  <meta name="theme-color" content="#f6f4ef" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="progress" id="progress"></div>
  <div class="api-banner" id="apiBanner" hidden></div>

  <header class="nav" id="nav">
    <div class="nav__inner container">
      <a href="#/" class="logo" aria-label="Agora home">
        <span class="logo__mark">A</span><span class="logo__word">agora</span>
      </a>
      <form class="search" id="navSearch" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input name="q" type="search" placeholder="Search sofas, cameras, sneakers…" autocomplete="off" aria-label="Search listings" />
        <kbd>/</kbd>
      </form>
      <nav class="nav__links">
        <a href="#/shop" class="nav__link" data-nav="shop">Shop</a>
        <a href="#/messages" class="nav__link nav__icon" data-auth aria-label="Messages">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span class="dot" id="msgDot" hidden></span>
        </a>
        <a href="#/account/favorites" class="nav__link nav__icon" aria-label="Saved items">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
        </a>
        <button class="nav__link nav__icon" id="cartBtn" aria-label="Open cart">
          <svg viewBox="0 0 24 24"><path d="M5 7h14l-1.5 12h-11z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span class="badge" id="cartCount" hidden>0</span>
        </button>
        <div id="navUser"></div>
        <a href="#/sell" class="btn btn--ink btn--sm magnetic">Sell an item</a>
      </nav>
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span></button>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <a href="#/shop">Shop all</a><a href="#/sell">Sell an item</a><a href="#/messages">Messages</a>
    <a href="#/account">My account</a><a href="#/account/favorites">Saved</a>
  </div>

  <main id="app" class="page" tabindex="-1"></main>

  <footer class="footer">
    <div class="container">
      <div class="footer__top">
        <h2 class="footer__big">Give good things<br/><em>a second story.</em></h2>
        <form class="newsletter" id="newsletter">
          <label for="nlEmail">Weekly drops, no spam.</label>
          <div><input id="nlEmail" type="email" required placeholder="you@email.com" /><button class="btn btn--lime">Subscribe</button></div>
        </form>
      </div>
      <div class="footer__cols">
        <div><h4>Shop</h4><a href="#/shop?category=home">Home & Living</a><a href="#/shop?category=fashion">Fashion</a><a href="#/shop?category=electronics">Electronics</a><a href="#/shop?category=watches">Watches</a></div>
        <div><h4>Sell</h4><a href="#/sell">List an item</a><a href="#/account/listings">My listings</a><a href="#/account/sales">My sales</a></div>
        <div><h4>Agora</h4><a href="#/about">How it works</a><a href="#/about">Buyer protection</a><a href="#/about">Trust & safety</a></div>
      </div>
      <div class="footer__bottom"><span>© <span id="year"></span> Agora Marketplace</span><span>Photos: Unsplash</span></div>
    </div>
  </footer>

  <aside class="drawer" id="cartDrawer" aria-hidden="true">
    <div class="drawer__scrim" data-close></div>
    <div class="drawer__panel" role="dialog" aria-label="Shopping cart">
      <div class="drawer__head"><h3>Your bag</h3><button class="icon-btn" data-close aria-label="Close cart">✕</button></div>
      <div class="drawer__body" id="cartBody"></div>
      <div class="drawer__foot" id="cartFoot"></div>
    </div>
  </aside>

  <div class="modal" id="modal" aria-hidden="true"><div class="modal__scrim" data-close></div><div class="modal__box" id="modalBox"></div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
