<style>:root {
  --bg: #f6f5f2;
  --card: #ffffff;
  --text: #1d1d1b;
  --muted: #6c6a64;
  --line: #e4e2dc;
  --soft: #efede8;
  --accent: #2f7d6d;
  --accent-text: #ffffff;
  --danger: #b4372a;
  --ok: #2f7d6d;
  --warn: #b36b00;
  --protein: #b5523b;
  --carbs: #c08a1e;
  --fat: #3b6fb6;
  --radius: 16px;
  --tabs-h: 64px;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414;
    --card: #1f1f1e;
    --text: #f1efea;
    --muted: #a19e96;
    --line: #34332f;
    --soft: #2a2a28;
    --accent: #5bb8a3;
    --accent-text: #0d1f1b;
    --danger: #ef7f70;
    --ok: #6fc7b2;
    --warn: #f0a640;
    --protein: #e07a62;
    --carbs: #e0b04a;
    --fat: #7aa5e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #141414;
    --card: #1f1f1e;
    --text: #f1efea;
    --muted: #a19e96;
    --line: #34332f;
    --soft: #2a2a28;
    --accent: #5bb8a3;
    --accent-text: #0d1f1b;
    --danger: #ef7f70;
    --ok: #6fc7b2;
    --warn: #f0a640;
    --protein: #e07a62;
    --carbs: #e0b04a;
    --fat: #7aa5e6;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

#app {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 12px) 16px calc(var(--tabs-h) + env(safe-area-inset-bottom) + 24px);
}

/* Blank the screen while the app is in the background so the app switcher shows nothing. */
body.hide-content #app, body.hide-content #tabs { visibility: hidden; }

h1 { font-size: 1.75rem; margin: 8px 0 14px; letter-spacing: -0.02em; }
h2 { font-size: 1.05rem; margin: 0; }
h3 { font-size: 0.85rem; margin: 14px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
p { margin: 8px 0; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.center { text-align: center; }
.ok { color: var(--ok); }
.error { color: var(--danger); margin: 4px 0; }
.grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin: 0 0 12px;
}

.row { display: flex; align-items: center; gap: 8px; }
.row.end { justify-content: flex-end; margin-top: 16px; }
.row.wrap { flex-wrap: wrap; }
.stack { display: grid; gap: 8px; }

button, input, select { font: inherit; color: inherit; }

.btn {
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 11px 16px;
  min-height: 44px;
  font-weight: 600;
  cursor: pointer;
  background: var(--soft);
}
.btn.primary { background: var(--accent); color: var(--accent-text); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.wide { width: 100%; margin-top: 8px; }
.btn:disabled { opacity: 0.5; }
.btn:active, .chip:active, .rate:active, .toggle:active { transform: scale(0.97); }

.link { background: none; border: 0; color: var(--accent); padding: 4px; cursor: pointer; font-weight: 600; }

.icon-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  font-size: 1.4rem;
  line-height: 1;
  cursor: pointer;
  flex: none;
}
.icon-btn.small { width: 36px; height: 36px; font-size: 0.95rem; border-color: transparent; background: transparent; color: var(--muted); }
.icon-btn:disabled { opacity: 0.3; }

input, select {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg);
  font-size: 16px; /* prevents iOS zoom on focus */
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.field { display: grid; gap: 6px; margin: 12px 0; }
.field > span { font-size: 0.85rem; color: var(--muted); font-weight: 600; }

/* Today */
.day-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.day-title { flex: 1; text-align: center; }
.day-title h1 { margin: 4px 0 0; }

.tracker-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.tracker-head h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tracker-head .value { font-weight: 700; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; }

.toggle {
  flex: 1;
  min-height: 48px;
  border-radius: 12px;
  border: 2px solid var(--c);
  background: transparent;
  color: var(--c);
  font-weight: 700;
  cursor: pointer;
}
.toggle.on { background: var(--c); color: #fff; }

.rating { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.rate {
  min-height: 48px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg);
  font-weight: 700;
  font-size: 1.05rem;
  cursor: pointer;
}
.rate.on { background: var(--c); border-color: var(--c); color: #fff; }

.log input { flex: 1; }
.progress { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
.progress > div { height: 100%; background: var(--c); border-radius: 4px; transition: width 0.3s; }

.empty h2 { font-size: 1.2rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.chip {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 999px;
  padding: 8px 14px;
  min-height: 40px;
  font-weight: 600;
  cursor: pointer;
}
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.seg { margin-top: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg .chip { padding: 8px 4px; white-space: nowrap; }

/* Insights */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--soft); border-radius: 12px; padding: 10px; min-width: 0; }
.stat-v { font-weight: 700; font-size: 1rem; line-height: 1.25; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat-l { font-size: 0.75rem; color: var(--muted); }

.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .tick { font-size: 9px; fill: var(--muted); }
.chart .grid { stroke: var(--line); stroke-dasharray: 2 3; }
.chart .axis { stroke: var(--line); }
.chart .goal { stroke: var(--text); stroke-dasharray: 4 3; opacity: 0.5; }
.chart.heat { width: auto; max-width: 100%; height: auto; margin: 0 auto; }
.chart .empty { fill: var(--soft); }

.rels { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 10px; }
.rels li { display: flex; gap: 10px; align-items: flex-start; }
.badge { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; background: var(--soft); }
.badge.pos { color: var(--ok); }
.badge.neg { color: var(--danger); }

/* History & settings lists */
.hist h3 { margin-top: 0; }
.hist ul, .manage { list-style: none; padding: 0; margin: 0; }
.hist li, .manage li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.hist li:first-child, .manage li:first-child { border-top: 0; }
.hist .value { font-weight: 700; font-variant-numeric: tabular-nums; }
section > select { margin-bottom: 12px; }
.bullets { padding-left: 20px; margin: 8px 0 0; }
.bullets li { margin: 6px 0; }

.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 3px solid transparent; cursor: pointer; }
.swatch.on { border-color: var(--text); box-shadow: inset 0 0 0 2px var(--card); }

/* Bottom tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 10;
}
.tabs[hidden] { display: none; }
.tab {
  height: var(--tabs-h);
  border: 0; background: none;
  display: grid; place-items: center; align-content: center; gap: 2px;
  color: var(--muted);
  font-size: 0.72rem; font-weight: 600;
  cursor: pointer;
}
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--accent); }

/* Dialogs */
dialog.sheet {
  border: 0;
  padding: 0;
  width: min(520px, 100%);
  max-width: 100%;
  max-height: 90dvh;
  margin: auto auto 0;
  border-radius: 20px 20px 0 0;
  background: var(--card);
  color: var(--text);
}
@media (min-width: 600px) { dialog.sheet { margin: auto; border-radius: 20px; } }
dialog.sheet::backdrop { background: rgb(0 0 0 / 0.45); }
.sheet-body { padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet-body h2 { font-size: 1.2rem; margin-bottom: 4px; }

/* Lock */
.lock { min-height: 80dvh; display: grid; align-content: center; gap: 12px; max-width: 340px; margin: 0 auto; text-align: center; }
.lock h1 { margin: 0; }
.lock-icon { font-size: 2.6rem; }
.lock input { text-align: center; font-size: 1.2rem; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom) + 14px);
  background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 12px;
  font-size: 0.9rem; font-weight: 600;
  max-width: calc(100% - 32px);
  z-index: 50;
}
.toast[hidden] { display: none; }
.noscript { padding: 24px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- Food ---------- */
.warn { color: var(--warn); }
.block { display: block; }
.big { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.seg3 { grid-template-columns: repeat(3, 1fr); }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid2 .field { margin: 6px 0; }
.callout { border-color: var(--accent); }

.summary .kcal-row { display: flex; justify-content: space-between; align-items: end; margin-bottom: 8px; }
.summary .right { text-align: right; }
.progress.kcal { height: 12px; border-radius: 6px; margin-bottom: 14px; }
.progress.kcal > div { background: var(--accent); }
.mbar { margin: 8px 0; font-size: 0.9rem; }
.mbar .row { margin-bottom: 4px; }
.mbar span:last-child { font-variant-numeric: tabular-nums; }
.m-p { --c: var(--protein); }
.m-c { --c: var(--carbs); }
.m-f { --c: var(--fat); }
.stat.m-p .stat-v, .macros .m-p { color: var(--protein); }
.stat.m-c .stat-v, .macros .m-c { color: var(--carbs); }
.stat.m-f .stat-v, .macros .m-f { color: var(--fat); }
.stats.four { grid-template-columns: repeat(4, 1fr); }

.scan-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
.big-btn { min-height: 56px; font-size: 1rem; }

.meal .tracker-head { margin-bottom: 4px; }
.meal .tracker-head h2 { flex: none; }
.meal .tracker-head .muted { flex: 1; text-align: right; }
.icon-btn.add { color: var(--accent); font-size: 1.4rem; font-weight: 600; }
.entries { list-style: none; padding: 0; margin: 4px 0 0; }
.entries li { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 2px 0; }
.entries li:first-child { border-top: 0; }
.plan-meal .entries li { padding: 6px 0; }
.entry { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; background: none; border: 0; padding: 4px 0; text-align: left; cursor: pointer; }
.entry .grow { white-space: normal; }
.plan-meal { border-top: 1px solid var(--line); padding-top: 4px; margin-top: 8px; }
.plan-meal h3 { margin: 8px 0 2px; }

.results { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 6px; }
.results .label { padding: 4px 2px 0; }
.result { width: 100%; text-align: left; display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.r-name { font-weight: 600; }
.r-meta { font-size: 0.8rem; color: var(--muted); }
.src { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--text); vertical-align: 1px; }
.src-usda { background: color-mix(in srgb, var(--fat) 22%, transparent); }
.src-off { background: color-mix(in srgb, var(--carbs) 25%, transparent); }
.src-you { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.search { min-height: 60dvh; }
.preview { background: var(--soft); border-radius: 12px; padding: 12px; margin-top: 4px; }
.macros { display: flex; gap: 14px; font-weight: 700; font-size: 0.9rem; margin-top: 2px; }

.switch-row { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
.switch-row input { width: 48px; height: 28px; min-height: 0; flex: none; accent-color: var(--accent); }

/* Scanner */
dialog.scanner { border: 0; padding: 0; margin: 0; width: 100%; height: 100%; max-width: none; max-height: none; background: #000; color: #fff; }
dialog.scanner::backdrop { background: #000; }
.scan-view { position: absolute; inset: 0; }
.scan-video { width: 100%; height: 100%; object-fit: cover; }
.scan-guide { position: absolute; left: 10%; right: 10%; top: 32%; height: 22%; border: 3px solid rgb(255 255 255 / 0.9); border-radius: 16px; box-shadow: 0 0 0 100vmax rgb(0 0 0 / 0.45); }
.scan-line { position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: #ff4d4d; box-shadow: 0 0 8px #ff4d4d; }
.scan-panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgb(0 0 0 / 0.85) 25%); display: grid; gap: 10px; }
.scan-panel .btn.ghost { color: #fff; border-color: rgb(255 255 255 / 0.4); flex: 1; }
.scan-panel input { background: rgb(255 255 255 / 0.12); border-color: rgb(255 255 255 / 0.3); color: #fff; flex: 1; }
.scan-status { text-align: center; font-weight: 600; margin: 0 0 4px; }
@media (prefers-reduced-motion: no-preference) {
  .scan-line { animation: scan 1.6s ease-in-out infinite alternate; }
  @keyframes scan { from { top: 15%; } to { top: 85%; } }
}

/* ---------- Gym ---------- */
.src-est { background: color-mix(in srgb, var(--protein) 20%, transparent); }
.link.back { margin: 4px 0 -4px; padding-left: 0; }
.tags .tag { font-size: 0.78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--soft); }
.chev { color: var(--muted); font-size: 1.2rem; }
.ex-row strong { font-weight: 600; }

.body-maps { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; max-width: 420px; margin: 0 auto; }
.body-map { width: 100%; height: auto; }
.body-map .silhouette > * { fill: var(--soft); stroke: var(--line); stroke-width: 1; }
.body-map .muscle path { fill: color-mix(in srgb, var(--muted) 22%, var(--card)); stroke: var(--card); stroke-width: 0.8; transition: fill 0.2s; }
.body-map .muscle.secondary path { fill: color-mix(in srgb, var(--protein) 45%, var(--card)); }
.body-map .muscle.primary path { fill: var(--protein); }
.body-map .muscle.selected path { stroke: var(--text); stroke-width: 1.5; }
.body-map .muscle[role="button"] { cursor: pointer; outline: none; }
.body-map .muscle[role="button"]:focus-visible path { stroke: var(--accent); stroke-width: 2; }
.body-map .map-label { font-size: 11px; fill: var(--muted); font-weight: 600; }
.legend { display: flex; align-items: flex-start; gap: 8px; font-size: 0.88rem; margin-top: 6px; }
.legend .sw { flex: none; margin-top: 3px; }
.grow-wrap { flex: 1; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend .sw.primary { background: var(--protein); }
.legend .sw.secondary { background: color-mix(in srgb, var(--protein) 45%, var(--card)); }
.muscle-info { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
.lib-search { margin-bottom: 10px; }

.demo { width: 100%; height: auto; max-height: 260px; display: block; }
.demo .ground { stroke: var(--line); stroke-width: 2; }
.demo .limb { stroke: var(--accent); stroke-width: 7; stroke-linecap: round; }
.demo .limb.far { opacity: 0.45; }
.demo .head { fill: var(--accent); }
.demo .joint { fill: var(--card); }
.demo .torso-fill { fill: var(--accent); }
.demo .ghost .limb { stroke: var(--muted); opacity: 0.22; }
.demo .ghost .head, .demo .ghost .torso-fill { fill: var(--muted); opacity: 0.22; }
.demo .ghost .joint, .demo .ghost .plate, .demo .ghost .prop, .demo .ghost .prop-line, .demo .ghost .cable { display: none; }
.demo .plate { fill: var(--text); opacity: 0.8; }
.demo .prop { fill: var(--line); }
.demo .prop-line { stroke: var(--muted); stroke-width: 4; stroke-linecap: round; }
.demo .prop-line.thin { stroke-width: 2; }
.demo .cable { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 3; }

.steps { padding-left: 22px; margin: 6px 0 14px; }
.steps li { margin: 6px 0; }
.card h2 + p, .card h2 + ol, .card h2 + ul { margin-top: 6px; }
.card > h2:not(:first-child) { margin-top: 14px; }
.mistakes li::marker { content: '✕  '; color: var(--danger); }
.safety-card { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.guide { width: 100%; border-collapse: collapse; font-size: 0.86rem; margin: 6px 0; }
.guide th, .guide td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.guide th { color: var(--muted); font-weight: 600; }

.ex-card .ex-title { display: flex; align-items: flex-start; gap: 8px; width: 100%; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.ex-card .ex-title h2 { margin-bottom: 2px; }
.tip { background: var(--soft); border-radius: 10px; padding: 8px 10px; }
.sets { margin: 6px 0; padding-left: 22px; }
.sets li { padding: 0; }
.sets li > * { vertical-align: middle; }
.sets li { display: list-item; }
.sets li .grow { display: inline-block; min-width: 60%; font-variant-numeric: tabular-nums; font-weight: 600; }
.set-form input { width: 0; flex: 1; text-align: center; }
.set-form .btn { flex: none; }
.add-ex summary { cursor: pointer; font-weight: 600; color: var(--accent); }

.rest {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 40;
  bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom) + 10px);
  width: min(528px, calc(100% - 32px));
  display: flex; align-items: center; gap: 8px;
  background: var(--text); color: var(--bg);
  border-radius: 14px; padding: 8px 8px 8px 14px; font-size: 1.05rem;
}
.rest[hidden] { display: none; }
.rest strong { font-variant-numeric: tabular-nums; font-size: 1.2rem; }
.rest .btn.ghost { color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); min-height: 38px; padding: 6px 12px; }

.volume { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 7px; }
.volume li { display: grid; grid-template-columns: 112px 1fr 34px; align-items: center; gap: 8px; font-size: 0.85rem; }
.v-bar { position: relative; height: 10px; border-radius: 5px; background: var(--soft); overflow: hidden; }
.v-zone { position: absolute; left: 40%; width: 40%; top: 0; bottom: 0; background: color-mix(in srgb, var(--ok) 18%, transparent); }
.v-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--muted); }
.v-fill.ok { background: var(--ok); }
.v-fill.hi { background: var(--warn); }
.v-num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

.parq { padding-left: 20px; }
.parq li { margin: 10px 0; }
.parq li p { margin: 0 0 6px; }
.parq .chip { min-width: 64px; }
.alert { border-radius: 12px; padding: 12px; margin-top: 10px; }
.alert p { margin: 4px 0 0; }
.okbox { background: color-mix(in srgb, var(--ok) 15%, transparent); }
.warnbox { background: color-mix(in srgb, var(--warn) 18%, transparent); }
.dangerbox { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 7%, var(--card)); }
.special { border-top: 1px solid var(--line); padding: 10px 0; }
.special summary { font-weight: 600; cursor: pointer; }
.refs { padding-left: 20px; }
.refs li { margin: 10px 0; }
.refs a { color: var(--accent); font-weight: 600; }
.body-map .silhouette { pointer-events: none; }

/* ---------- Moroccan food database ---------- */
.scan-actions .browse-btn { grid-column: 1 / -1; min-height: 50px; }
.result.with-thumb { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: center; }
.r-text { display: grid; gap: 2px; min-width: 0; }
.r-ar { color: var(--muted); font-weight: 500; }
.thumb { display: grid; place-items: center; border-radius: 10px; background: var(--soft); overflow: hidden; font-size: 1.5rem; line-height: 1; flex: none; }
.thumb-sm { width: 48px; height: 48px; }
.thumb-lg { width: 84px; height: 84px; font-size: 2.6rem; border-radius: 14px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; background: #fff; }
.portion-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 4px; }
.portion-head h2 { margin: 0 0 2px; }
.portion-head p { margin: 2px 0; }
.browse .chips { margin: 8px 0; }
.browse .cats { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
.browse .cats .chip { flex: none; min-height: 34px; padding: 6px 12px; font-size: 0.85rem; }
.browse input[type=search] { margin-bottom: 4px; }
.r-ar { display: inline-block; margin-inline-start: 6px; }

/* ---------- Ingredients editor, own photos, photo recognition ---------- */
.src-rec { background: color-mix(in srgb, var(--ok) 20%, transparent); }
.src-ai { background: color-mix(in srgb, var(--fat) 30%, transparent); }
.thumb-col { display: grid; justify-items: center; gap: 2px; flex: none; }
.thumb-col .link { padding: 2px; white-space: nowrap; }
.delta { font-size: 0.9rem; font-weight: 600; margin-inline-start: 6px; }
.ing-box { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 8px; }
.ing-box summary { font-weight: 700; cursor: pointer; padding: 6px 0; }
.ing-list { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 6px; }
.ing-list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.ing-list li:first-child { border-top: 0; }
.ing-list li.removed .ing-name { text-decoration: line-through; color: var(--muted); }
.ing-name { flex: 1; min-width: 0; font-size: 0.92rem; }
.ing-mult { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.mult { border: 0; background: transparent; padding: 7px 8px; min-height: 36px; font-size: 0.8rem; font-weight: 600; cursor: pointer; color: var(--muted); }
.mult + .mult { border-inline-start: 1px solid var(--line); }
.mult.on { background: var(--accent); color: var(--accent-text); }
.ai-photo { width: 84px; height: 84px; object-fit: cover; border-radius: 14px; flex: none; }
.ai-list { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 10px; }
.ai-list li { display: grid; grid-template-columns: auto 48px 1fr; gap: 10px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 12px; }
.ai-list li.off { opacity: 0.55; }
.ai-list input[type=checkbox] { width: 22px; height: 22px; min-height: 0; margin-top: 12px; accent-color: var(--accent); }
.ai-list .row { margin-top: 6px; flex-wrap: wrap; }
.g-in { width: 76px; flex: none; min-height: 38px; padding: 6px 8px; text-align: center; }
.conf { font-size: 0.7rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--soft); text-transform: uppercase; letter-spacing: 0.03em; }
.conf-high { color: var(--ok); }
.conf-low { color: var(--warn); }
.spinner { width: 36px; height: 36px; margin: 8px auto; border-radius: 50%; border: 4px solid var(--soft); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.ai-kcal { flex: 1; min-width: 0; font-size: 0.9rem; }
</style>
</head>

/** Nutrition per 100 g of a recipe dish with some ingredients removed or changed. */
function recipeN(food, mult) {
  const out = { kcal: 0, p: 0, c: 0, f: 0, fib: 0 };
  for (const [id, g] of food.ing) {
    const info = ingredientInfo(id);
    if (!info) continue;
    const m = mult[id] ?? 1;
    for (const k of Object.keys(out)) out[k] += (info.n[k] * g * m) / 100;
  }
  return out;
}

function modsLabel(food, mult) {
  const parts = Object.entries(mult).filter(([, m]) => m !== 1).map(([id, m]) => {
    const nm = (ingredientInfo(id)?.name || id).split(' (')[0].toLowerCase();
    return m === 0 ? `no ${nm}` : m === 0.5 ? `½ ${nm}` : `2× ${nm}`;
  });
  return parts.join(', ');
}

/** Add or replace your own photo of a food. Stored privately (encrypted with your passcode). */
async function addMyPhoto(food, box) {
  const input = h('input', { type: 'file', accept: 'image/*', capture: 'environment' });
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const { dataUrl } = await preparePhoto(file, 320);
      F().myPhotos[food.id] = dataUrl;
      await ctx.save();
      box.replaceWith(foodThumb(food, { size: 'lg', userPhoto: dataUrl }));
      toast('Photo saved on your phone');
    } catch {
      toast("Couldn't read that photo.");
    }
  });
  input.click();
}

function portionDialog(food, { grams: g0, meal: m0, edit = false, okLabel } = {}) {
  return modal((done) => {
    const mult = {};
    const hasRecipe = Array.isArray(food.ing) && food.ing.length && food.ing.every(([id]) => ingredientInfo(id));
    const grams = h('input', { type: 'text', inputmode: 'decimal', value: String(g0 ?? food.serving), 'aria-label': 'Amount in grams', autofocus: true });
    const meal = h('select', { 'aria-label': 'Meal' }, ...Object.entries(MEALS).map(([k, v]) => h('option', { value: k, selected: k === (m0 || defaultMeal()) }, v)));
    const preview = h('div', { class: 'preview' });
    const ingList = h('ul', { class: 'ing-list' });
    const val = () => parseFloat(grams.value.replace(',', '.'));
    const changed = () => hasRecipe && Object.keys(mult).length > 0;
    const currentN = () => (changed() ? recipeN(food, mult) : food.n);
    const update = () => {
      const g = val();
      if (!(g > 0)) { preview.replaceChildren(h('span', { class: 'muted' }, 'Enter an amount')); return; }
      const n = scale(currentN(), g);
      const base = scale(food.n, g);
      const diff = changed() ? Math.round(n.kcal - base.kcal) : 0;
      preview.replaceChildren(
        h('div', { class: 'big' }, `${k0.format(n.kcal)} kcal`,
          diff ? h('span', { class: `delta ${diff < 0 ? 'ok' : 'warn'}` }, ` ${diff > 0 ? '+' : '−'}${k0.format(Math.abs(diff))} vs usual recipe`) : null),
        h('div', { class: 'macros' },
          h('span', { class: 'm-p' }, `P ${k1.format(n.p)} g`), h('span', { class: 'm-c' }, `C ${k1.format(n.c)} g`), h('span', { class: 'm-f' }, `F ${k1.format(n.f)} g`)));
      if (hasRecipe) {
        ingList.replaceChildren(...food.ing.map(([id, per100]) => {
          const info = ingredientInfo(id);
          const m = mult[id] ?? 1;
          const ig = (per100 * g) / 100;
          const kcal = (info.n.kcal * ig * m) / 100;
          return h('li', { class: m === 0 ? 'removed' : '' },
            h('span', { class: 'ing-name' }, info.name, h('span', { class: 'muted small block' }, `${k0.format(ig * m)} g · ${k0.format(kcal)} kcal`)),
            h('span', { class: 'ing-mult', role: 'group', 'aria-label': `${info.name} amount` }, ...MULTS.map(([v, l]) => h('button', {
              type: 'button', class: `mult${m === v ? ' on' : ''}`, 'aria-pressed': String(m === v),
              onclick: () => { if (v === 1) delete mult[id]; else mult[id] = v; update(); },
            }, l))));
        }));
      }
    };
    grams.addEventListener('input', update);
    const quick = [
      [food.servingLabel !== '100 g' ? `${food.servingLabel}` : null, food.serving],
      ['½ serving', food.serving / 2], ['2 servings', food.serving * 2], ['100 g', 100],
    ].filter(([l]) => l).map(([l, g]) => h('button', { type: 'button', class: 'chip', onclick: () => { grams.value = String(Math.round(g * 10) / 10); update(); } }, l === food.servingLabel && !/\bg\b/.test(l) ? `${l} (${k0.format(g)} g)` : l));
    update();
    const thumb = foodThumb(food, { size: 'lg', photos: photosOn(), userPhoto: F().myPhotos[food.id] });
    return h('form', {
      class: 'sheet-body',
      onsubmit: (e) => {
        e.preventDefault();
        const g = val();
        if (!(g > 0 && g < 10000)) return;
        let chosen = food;
        const label = hasRecipe ? modsLabel(food, mult) : '';
        if (label) {
          chosen = { ...food, id: `${food.id}~${uid().slice(0, 6)}`, name: `${food.name} (${label})`.slice(0, 80), n: recipeN(food, mult), ing: null };
        }
        done({ grams: g, meal: meal.value, food: chosen });
      },
    },
    h('div', { class: 'portion-head' },
      h('div', { class: 'thumb-col' }, thumb,
        h('button', { type: 'button', class: 'link small', onclick: () => addMyPhoto(food, thumb) }, F().myPhotos[food.id] ? '📷 Change photo' : '📷 Add photo')),
      h('div', { class: 'grow-wrap' },
        h('h2', {}, food.name),
        food.fr || food.ar ? h('p', { class: 'muted small' }, food.fr || '', food.ar ? h('span', { lang: 'ar', dir: 'rtl' }, ` · ${food.ar}`) : null) : null,
        h('p', { class: 'muted small' }, food.brand ? `${food.brand} · ` : '', food.qty ? `${food.qty} · ` : '', sourceBadge(food),
          food.where ? ` · ${WHERE_LABEL[food.where] || ''}` : ''))),
    h('p', { class: 'muted small' }, `Per 100 g: ${macroLine(food.n)}`),
    h('div', { class: 'chips' }, ...quick),
    h('div', { class: 'row' }, h('label', { class: 'field grow' }, h('span', {}, 'Grams'), grams), h('label', { class: 'field grow' }, h('span', {}, 'Meal'), meal)),
    preview,
    hasRecipe ? h('details', { class: 'ing-box', open: true },
      h('summary', {}, 'Ingredients in this portion'),
      h('p', { class: 'muted small' }, 'Remove or change an ingredient to see the new calories. Based on a typical recipe (USDA ingredient values).'),
      ingList) : null,
    !hasRecipe && food.labelIngredients ? h('details', { class: 'ing-box' },
      h('summary', {}, 'Ingredients (from the label)'),
      h('p', { class: 'small' }, food.labelIngredients),
      h('p', { class: 'muted small' }, 'Packaged product: the recipe is fixed, so ingredients can’t be removed.')) : null,
    h('div', { class: 'row end' },
      edit ? h('button', { type: 'button', class: 'btn danger', onclick: () => done('delete') }, 'Delete') : null,
      h('button', { type: 'button', class: 'btn ghost', onclick: () => done(null) }, 'Cancel'),
      h('button', { type: 'submit', class: 'btn primary' }, okLabel || (edit ? 'Save' : 'Add'))));
  });
}

/** Manual entry straight from a nutrition label. Values can be per 100 g or per serving. */
function labelDialog({ code = '', name = '' } = {}) {
  return modal((done) => {
    const f = (ph, extra = {}) => h('input', { type: 'text', inputmode: 'decimal', placeholder: ph, ...extra });
    const nm = h('input', { value: name, placeholder: 'e.g. Protein bar', maxlength: 80, autofocus: true, required: true });
    const basis = h('select', {}, h('option', { value: 'serving' }, 'Per serving'), h('option', { value: '100' }, 'Per 100 g / 100 ml'));
    const sg = f('e.g. 60', { value: '' });
    const kcal = f('kcal'); const p = f('g'); const c = f('g'); const fat = f('g'); const fib = f('g (optional)');
    const sgWrap = h('label', { class: 'field' }, h('span', {}, 'Serving size (g)'), sg);
    basis.addEventListener('change', () => { sgWrap.hidden = basis.value === '100'; });
    const err = h('p', { class: 'error', hidden: true });
    const v = (el) => parseFloat(el.value.replace(',', '.'));
    return h('form', {
      class: 'sheet-body',
      onsubmit: (e) => {
        e.preventDefault();
        const per = basis.value === '100' ? 100 : v(sg);
        const vals = [v(kcal), v(p), v(c), v(fat)];
        if (!(per > 0) || vals.some((x) => !(x >= 0))) { err.textContent = 'Fill in serving size, calories, protein, carbs and fat.'; err.hidden = false; return; }
        const k = 100 / per;
        const food = cleanFood({
          id: `you:${uid()}`, code, name: nm.value.trim(), source: 'You',
          n: { kcal: vals[0] * k, p: vals[1] * k, c: vals[2] * k, f: vals[3] * k, fib: (v(fib) || 0) * k },
          serving: per, servingLabel: basis.value === '100' ? '100 g' : `1 serving (${per} g)`,
        });
        if (!food) { err.textContent = 'Those numbers look off. Check the label.'; err.hidden = false; return; }
        done(food);
      },
    },
    h('h2', {}, 'Enter from the label'),
    h('p', { class: 'muted small' }, code ? `Barcode ${code} will be remembered, so next time a scan finds it instantly (offline).` : 'Copy the numbers from the nutrition facts panel.'),
    h('label', { class: 'field' }, h('span', {}, 'Name'), nm),
    h('label', { class: 'field' }, h('span', {}, 'Values are'), basis),
    sgWrap,
    h('div', { class: 'grid2' },
      h('label', { class: 'field' }, h('span', {}, 'Calories'), kcal),
      h('label', { class: 'field' }, h('span', {}, 'Protein'), p),
      h('label', { class: 'field' }, h('span', {}, 'Carbs'), c),
      h('label', { class: 'field' }, h('span', {}, 'Fat'), fat),
      h('label', { class: 'field' }, h('span', {}, 'Fiber'), fib)),
    err,
    h('div', { class: 'row end' },
      h('button', { type: 'button', class: 'btn ghost', onclick: () => done(null) }, 'Cancel'),
      h('button', { type: 'submit', class: 'btn primary' }, 'Save food')));
  });
}

function dedupe(list) {
  const seen = new Set();
  return list.filter((f) => (seen.has(f.id) ? false : seen.add(f.id)));
}

/** Search sheet. Built-in + saved foods instantly; online sources on request. */
function searchDialog(meal) {
  return modal((done) => {
    const q = h('input', { type: 'search', placeholder: 'Search: msemen, Jaouda, harira, banane…', 'aria-label': 'Search foods', autofocus: true, enterkeyhint: 'search' });
    const list = h('ul', { class: 'results' });
    const online = h('ul', { class: 'results' });
    const status = h('p', { class: 'muted small' });
    const pick = (food) => done(food);
    const local = () => {
      const res = dedupe(searchLocal(q.value, [...(F().moroccoDb ? foodDb() : []), ...F().saved])).slice(0, 30);
      list.replaceChildren(...res.map((f) => resultRow(f, pick)));
      if (!q.value.trim()) {
        const recent = F().saved.slice(0, 8);
        list.replaceChildren(...(recent.length ? [h('li', { class: 'muted small label' }, 'Recent'), ...recent.map((f) => resultRow(f, pick))] : []));
      }
    };
    const goOnline = async () => {
      const term = q.value.trim();
      if (!term) { q.focus(); return; }
      if (!await ensureOnline()) return;
      status.textContent = 'Searching USDA and Open Food Facts…';
      online.replaceChildren();
      const { results, failed } = await searchOnline(term, F().usdaKey);
      status.textContent = results.length
        ? `${results.length} results from online sources${failed ? ' (one source did not respond)' : ''}.`
        : failed === 2 ? "Couldn't reach the databases. Check your connection." : 'No online results. Try simpler words.';
      online.replaceChildren(...results.map((f) => resultRow(f, pick)));
    };
    q.addEventListener('input', local);
    local();
    return h('div', { class: 'sheet-body search' },
      h('h2', {}, `Add to ${MEALS[meal]}`),
      h('form', { onsubmit: (e) => { e.preventDefault(); goOnline(); } }, q),
      list,
      h('div', { class: 'row wrap' },
        h('button', { class: 'btn ghost', type: 'button', onclick: goOnline }, '🌐 Search online'),
        h('button', { class: 'btn ghost', type: 'button', onclick: () => done('label') }, '✎ Enter from label')),
      status, online,
      h('div', { class: 'row end' }, h('button', { class: 'btn ghost', type: 'button', onclick: () => done(null) }, 'Close')));
  });
}

/** Catalogue of Moroccan foods from the repo database, by where they're sold. */
function browseDialog(meal) {
  return modal((done) => {
    let where = 'supermarket'; let cat = ''; let limit = 40;
    const q = h('input', { type: 'search', placeholder: 'Filter (name, brand, Darija…)', 'aria-label': 'Filter Moroccan foods' });
    const whereChips = h('div', { class: 'chips' });
    const catChips = h('div', { class: 'chips cats' });
    const list = h('ul', { class: 'results' });
    const status = h('p', { class: 'muted small' });
    const more = h('button', { class: 'btn ghost wide', type: 'button', hidden: true, onclick: () => { limit += 60; draw(); } }, 'Show more');
    const draw = () => {
      const all = foodDb();
      if (!all.length) { list.replaceChildren(); return; }
      whereChips.replaceChildren(...Object.entries(WHERE_LABEL).filter(([k]) => all.some((f) => f.where === k)).map(([k, l]) => h('button', {
        type: 'button', class: `chip${k === where ? ' on' : ''}`, onclick: () => { where = k; cat = ''; limit = 40; draw(); },
      }, l)));
      const inWhere = all.filter((f) => f.where === where);
      const cats = [...new Set(inWhere.map((f) => f.cat).filter(Boolean))].sort();
      catChips.replaceChildren(...['', ...cats].map((c) => h('button', {
        type: 'button', class: `chip small${c === cat ? ' on' : ''}`, onclick: () => { cat = c; limit = 40; draw(); },
      }, c || 'All')));
      const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
      const shown = inWhere.filter((f) => (!cat || f.cat === cat) && words.every((w) => f.hay.includes(w)));
      list.replaceChildren(...shown.slice(0, limit).map((f) => resultRow(f, done)));
      more.hidden = shown.length <= limit;
      status.textContent = `${shown.length} foods`;
    };
    q.addEventListener('input', () => { limit = 40; draw(); });
    const off = onFoodDb(draw);
    const close = (v) => { off(); done(v); };
    if (!foodDb().length) {
      status.textContent = 'Downloading the Moroccan food list from GitHub…';
      loadFoodDb({ force: true }).then(draw).catch(() => {
        status.textContent = "Couldn't download the food list. Check your connection and try again.";
      });
    }
    draw();
    const meta = foodDbMeta();
    return h('div', { class: 'sheet-body search browse' },
      h('h2', {}, `Moroccan foods · ${MEALS[meal]}`),
      whereChips, catChips, q, status, list, more,
      h('p', { class: 'muted small' }, meta.attribution || ''),
      h('div', { class: 'row end' }, h('button', { class: 'btn ghost', type: 'button', onclick: () => close(null) }, 'Close')));
  });
}

// ---------- photo recognition ----------
async function ensureAi() {
  const hosted = recognitionMode() === 'sample';
  if (F().ai && (hosted || F().aiKey)) return true;
  const key = h('input', { type: 'password', value: F().aiKey, placeholder: 'sk-ant-…', autocomplete: 'off', 'aria-label': 'Anthropic API key' });
  const err = h('p', { class: 'error', hidden: true });
  const ok = await modal((done) => h('form', {
    class: 'sheet-body',
    onsubmit: (e) => {
      e.preventDefault();
      if (!hosted && !/^sk-ant-[\w-]{10,}$/.test(key.value.trim())) { err.textContent = 'Paste an Anthropic API key (it starts with sk-ant-).'; err.hidden = false; return; }
      done(true);
    },
  },
  h('h2', {}, 'Recognise food from a photo'),
  h('p', {}, 'Claude looks at your photo, names each food (Moroccan dishes included), estimates the amount and its ingredients, and matches it to the food list. You check and adjust everything before it is logged.'),
  h('div', { class: 'alert warnbox' },
    h('strong', {}, 'This sends the photo off your phone.'),
    h('p', {}, hosted
      ? 'The photo goes to Claude through your claude.ai account. Only the photo and the food list are sent: never your diary, body stats or other data.'
      : 'The photo goes to Anthropic (the company that makes Claude) using your own API key. Only the photo and the food list are sent: never your diary, body stats or other data. Everything else in the app stays offline.')),
  hosted ? null : h('label', { class: 'field' }, h('span', {}, 'Your Anthropic API key'), key),
  hosted ? null : h('p', { class: 'muted small' }, 'Create one at console.anthropic.com (separate from a claude.ai subscription). It costs a few US cents per photo. The key stays on this phone, encrypted if you set a passcode.'),
  err,
  h('div', { class: 'row end' },
    h('button', { type: 'button', class: 'btn ghost', onclick: () => done(false) }, 'Not now'),
    h('button', { type: 'submit', class: 'btn primary' }, 'Turn on'))));
  if (!ok) return false;
  F().ai = true;
  if (!hosted) F().aiKey = key.value.trim();
  await ctx.save();
  return true;
}

function pickPhoto() {
  return new Promise((resolve) => {
    const input = h('input', { type: 'file', accept: 'image/*', capture: 'environment' });
    input.addEventListener('change', () => resolve(input.files[0] || null));
    input.click();
  });
}

function busy(text) {
  let close;
  modal((done) => { close = done; return h('div', { class: 'sheet-body center' }, h('div', { class: 'spinner', 'aria-hidden': 'true' }), h('p', {}, text)); });

}

function resultsDialog(result, meal) {
  const catalog = new Map(foodDb().map((f) => [f.id, f]));
  const items = result.items.map((x) => {
    const match = x.catalogId && catalog.get(x.catalogId);
    const food = match || {
      id: `ai:${uid()}`, name: x.name, source: 'Photo estimate', n: x.n, serving: x.grams || 100,
      servingLabel: `${x.grams || 100} g (from photo)`, emoji: '📸',
    };
    return { ...x, food, grams: x.grams || food.serving, on: x.confidence !== 'low' || result.items.length === 1 };
  });
  return modal((done) => {
    const list = h('ul', { class: 'ai-list' });
    const total = h('p', { class: 'big' });
    const logBtn = h('button', { type: 'button', class: 'btn primary' });
    const draw = () => {
      list.replaceChildren(...items.map((it) => {
        const n = scale(it.food.n, it.grams);
        const gIn = h('input', { type: 'text', inputmode: 'decimal', value: String(it.grams), 'aria-label': `${it.name} grams`, class: 'g-in' });
        gIn.addEventListener('change', () => { const v = parseFloat(gIn.value.replace(',', '.')); if (v > 0) { it.grams = v; draw(); } });
        return h('li', { class: it.on ? '' : 'off' },
          h('input', { type: 'checkbox', checked: it.on, 'aria-label': `Log ${it.name}`, onchange: (e) => { it.on = e.target.checked; draw(); } }),
          foodThumb(it.food, { photos: photosOn(), userPhoto: F().myPhotos[it.food.id] }),
          h('div', { class: 'grow-wrap' },
            h('div', {}, h('strong', {}, it.food.name), ' ', h('span', { class: `conf conf-${it.confidence}` }, it.confidence)),
            it.food.id.startsWith('ai:') ? h('div', { class: 'muted small' }, 'Not in the food list: Claude’s estimate') : h('div', { class: 'muted small' }, `Matched: ${sourceBadge(it.food).textContent}`),
            it.ingredients.length ? h('div', { class: 'muted small' }, `Seen: ${it.ingredients.map((i) => `${i.name} ${i.grams} g`).join(', ')}`) : null,
            h('div', { class: 'row' }, gIn, h('span', { class: 'muted' }, 'g'), h('span', { class: 'ai-kcal' }, `${k0.format(n.kcal)} kcal · P ${k0.format(n.p)} g`),
              h('button', {
                type: 'button', class: 'link small', onclick: async () => {
                  const r = await portionDialog(it.food, { grams: it.grams, meal, okLabel: 'Use' });
                  if (r && r !== 'delete') { it.food = r.food || it.food; it.grams = r.grams; it.on = true; draw(); }
                },
              }, it.food.ing ? 'Ingredients…' : 'Adjust…'))));
      }));
      const sel = items.filter((i) => i.on);
      total.textContent = `${k0.format(sum(sel.map((i) => scale(i.food.n, i.grams))).kcal)} kcal`;
      logBtn.textContent = sel.length ? `Log ${sel.length} item${sel.length > 1 ? 's' : ''}` : 'Nothing selected';
      logBtn.disabled = !sel.length;
    };
    logBtn.addEventListener('click', () => done(items.filter((i) => i.on)));
    draw();
    return h('div', { class: 'sheet-body' },
      h('div', { class: 'row' }, h('img', { src: result.photo, alt: 'Your photo', class: 'ai-photo' }), h('div', { class: 'grow-wrap' }, h('h2', {}, 'What Claude sees'), total)),
      result.items.length ? null : h('p', { class: 'warn' }, 'No food recognised.'),
      result.notes ? h('p', { class: 'muted small' }, result.notes) : null,
      list,
      h('p', { class: 'muted small' }, 'Amounts from a photo are estimates (often ±20–30%). Check the grams, especially oil and sauces you can’t see.'),
      h('div', { class: 'row end' }, h('button', { type: 'button', class: 'btn ghost', onclick: () => done(null) }, 'Cancel'), logBtn));
  });
}

async function recognizeFlow(meal = defaultMeal()) {
  if (!await ensureAi()) return;
  const file = await pickPhoto();
  if (!file) return;
  const catalog = foodDb().filter((f) => f.where && f.where !== 'supermarket').map((f) => ({ id: f.id, name: f.name, fr: f.fr }));
  const stop = busy('Claude is looking at your photo…');
  let result;
  try {
    result = await recognizeFood(file, catalog, { apiKey: F().aiKey });
  } catch (err) {
    stop();
    toast(err instanceof RecognitionError ? err.message : 'Recognition failed. Try again.');
    if (err?.code === 'auth') { F().ai = false; await ctx.save(); }
    return;
  }
  stop();
  const chosen = await resultsDialog(result, meal);
  if (!chosen?.length) return;
  const ts = foodDay === dayKey() ? Date.now() : new Date(`${foodDay}T12:00`).getTime();
  for (const it of chosen) {
    remember(it.food);
    F().log.push({ ...cleanFood(it.food), id: uid(), day: foodDay, ts, grams: it.grams, meal });
  }
  await ctx.commit();
  toast(`Logged ${chosen.length} item${chosen.length > 1 ? 's' : ''}`);
}

async function browseFlow(meal = defaultMeal()) {
  const food = await browseDialog(meal);
  if (food) return pickAndLog(food, meal);
}

// ---------- flows ----------
async function pickAndLog(food, meal) {
  if (!food) return;
  const r = await portionDialog(food, { meal });
  if (r && r !== 'delete') await addEntry(r.food || food, r.grams, r.meal);
}

async function searchFlow(meal = defaultMeal()) {
  const res = await searchDialog(meal);
  if (res === 'label') { const f = await labelDialog(); return pickAndLog(f, meal); }
  return pickAndLog(res, meal);
}

async function scanFlow() {
  const raw = await scanBarcode();
  if (!raw) return;
  const code = canonicalBarcode(raw);
  const known = F().saved.find((s) => s.code && (s.code === code || s.code === raw));
  if (known) return pickAndLog(known);
  const local = F().moroccoDb ? (findByCode(code) || findByCode(raw)) : null;
  if (local) return pickAndLog(local);
  if (!await ensureOnline()) {
    toast(globalThis.POCKET_STATS_HOSTED ? `Barcode ${code} read. Enter its label once; next time this scan finds it instantly.` : 'Not in your saved foods. Enter it from the label instead.');
    return pickAndLog(await labelDialog({ code }));
  }
  toast('Looking up…');
  const { results, failed } = await lookupBarcode(code, F().usdaKey);
  if (!results.length) {
    toast(failed === 2 ? "Couldn't reach the databases. Enter it from the label." : 'Not in any database yet. Enter it from the label.');
    return pickAndLog(await labelDialog({ code }));
  }
  const choice = results.length === 1 ? results[0] : await chooseDialog(code, results);
  if (choice === 'label') return pickAndLog(await labelDialog({ code, name: results[0]?.name }));
  return pickAndLog(choice);
}

async function editEntry(e) {
  const r = await portionDialog(e, { grams: e.grams, meal: e.meal, edit: true });
  if (!r) return;
  if (r === 'delete') F().log = F().log.filter((x) => x !== e);
  else { e.grams = r.grams; e.meal = r.meal; }
  await ctx.commit();
}

function profileDialog() {
  const p = F().profile || { sex: 'male', age: 25, heightCm: 178, weightKg: 75, activity: 1.55, goal: 'lean', units: 'metric', diet: 'omnivore' };
  return modal((done) => {
    let units = p.units;
    const sex = h('select', {}, h('option', { value: 'male', selected: p.sex === 'male' }, 'Male'), h('option', { value: 'female', selected: p.sex === 'female' }, 'Female'));
    const age = h('input', { type: 'text', inputmode: 'numeric', value: String(p.age) });
    const hA = h('input', { type: 'text', inputmode: 'decimal' }); const hB = h('input', { type: 'text', inputmode: 'decimal', placeholder: 'in' });
    const w = h('input', { type: 'text', inputmode: 'decimal' });
    const hLabel = h('span', {}); const wLabel = h('span', {});
    const setUnits = (u, convert) => {
      if (convert) {
        const cur = read();
        units = u;
        fill(cur.heightCm, cur.weightKg);
      } else { units = u; fill(p.heightCm, p.weightKg); }
      seg.querySelectorAll('.chip').forEach((b) => b.classList.toggle('on', b.dataset.u === units));
    };
    const fill = (cm, kg) => {
      if (units === 'imperial') {
        const inches = (cm || 0) / 2.54;
        hA.value = String(Math.floor(inches / 12)); hB.value = String(Math.round(inches % 12)); hB.hidden = false;
        hA.placeholder = 'ft'; w.value = String(Math.round((kg || 0) / LB)); hLabel.textContent = 'Height (ft, in)'; wLabel.textContent = 'Weight (lb)';
      } else {
        hA.value = String(Math.round(cm || 0)); hB.hidden = true; hA.placeholder = 'cm';
        w.value = String(Math.round((kg || 0) * 10) / 10); hLabel.textContent = 'Height (cm)'; wLabel.textContent = 'Weight (kg)';
      }
    };
    const n = (el) => parseFloat(String(el.value).replace(',', '.'));
    const read = () => ({
      heightCm: units === 'imperial' ? ((n(hA) || 0) * 12 + (n(hB) || 0)) * 2.54 : n(hA),
      weightKg: units === 'imperial' ? n(w) * LB : n(w),
    });
    const seg = h('div', { class: 'chips seg2' },
      h('button', { type: 'button', class: 'chip', 'data-u': 'metric', onclick: () => setUnits('metric', true) }, 'kg / cm'),
      h('button', { type: 'button', class: 'chip', 'data-u': 'imperial', onclick: () => setUnits('imperial', true) }, 'lb / ft'));
    const activity = h('select', {}, ...Object.entries(ACTIVITY).map(([k, v]) => h('option', { value: k, selected: +k === p.activity }, v)));
    const goal = h('select', {}, ...Object.entries(GOALS).map(([k, v]) => h('option', { value: k, selected: k === p.goal }, v.label)));
    const diet = h('select', {}, h('option', { value: 'omnivore', selected: p.diet === 'omnivore' }, 'I eat everything'), h('option', { value: 'vegetarian', selected: p.diet === 'vegetarian' }, 'Vegetarian'));
    const err = h('p', { class: 'error', hidden: true });
    setUnits(units, false);
    return h('form', {
      class: 'sheet-body',
      onsubmit: (e) => {
        e.preventDefault();
        const { heightCm, weightKg } = read();
        const prof = normalizeFood({ profile: { sex: sex.value, age: n(age), heightCm, weightKg, activity: +activity.value, goal: goal.value, units, diet: diet.value } }).profile;
        if (!prof) { err.textContent = 'Check your age (13+), height and weight.'; err.hidden = false; return; }
        done(prof);
      },
    },
    h('h2', {}, 'Your body & goal'),
    h('p', { class: 'muted small' }, 'Used only to calculate your targets. Stored on this phone (encrypted if you set a passcode).'),
    seg,
    h('div', { class: 'grid2' },
      h('label', { class: 'field' }, h('span', {}, 'Sex'), sex),
      h('label', { class: 'field' }, h('span', {}, 'Age'), age),
      h('div', { class: 'field' }, hLabel, h('div', { class: 'row' }, hA, hB)),
      h('label', { class: 'field' }, wLabel, w)),
    h('label', { class: 'field' }, h('span', {}, 'Activity'), activity),
    h('label', { class: 'field' }, h('span', {}, 'Goal'), goal),
    h('label', { class: 'field' }, h('span', {}, 'Diet'), diet),

function weightTracker() {
  return ctx.state.trackers.find((t) => t.type === 'number' && /^(body ?)?weight$/i.test(t.name));
}

async function editProfile() {
  const prof = await profileDialog();
  if (!prof) return;
  F().profile = prof;
  // Keep a Weight tracker so progress shows up in Insights and the goal check.
  const unit = prof.units === 'imperial' ? 'lb' : 'kg';
  let wt = weightTracker();
  if (!wt) {
    wt = { id: uid(), name: 'Weight', type: 'number', unit, agg: 'last', goal: null, color: '#5f6b7a' };
    ctx.state.trackers.push(wt);
  }
  const today = dayKey();
  if (!ctx.state.entries.some((e) => e.trackerId === wt.id && e.day === today)) {
    const v = wt.unit === 'lb' ? prof.weightKg / LB : prof.weightKg;
    ctx.state.entries.push({ id: uid(), trackerId: wt.id, day: today, value: Math.round(v * 10) / 10, ts: Date.now() });
  }
  await ctx.commit();
  toast('Targets updated');
}

function bar(label, val, target, cls, unit = 'g') {
  const pct = target ? Math.min(1, val / target) : 0;

function viewGoal() {
  const p = F().profile;
  if (!p) return [h('h1', {}, 'Progress'), h('article', { class: 'card callout' }, h('button', { class: 'btn primary wide', onclick: editProfile }, 'Set up my targets'))];
  const t = targets(p);
  const days = dayRange(dayKey(), 14);
  const daily = days.map((d) => { const l = dayLog(d); return l.length ? totals(l) : null; });
  const out = [h('h1', {}, 'Progress')];

  // Weight trend vs goal rate
  const wt = weightTracker();
  let check = h('p', { class: 'muted' }, 'Log your weight (Today tab → Weight) a few mornings a week. After two weeks you’ll see if you’re gaining at the right speed.');
  if (wt) {
    const w = series(ctx.state, wt, dayRange(dayKey(), 14)).map((v) => (v === null ? null : wt.unit === 'lb' ? v * LB : v));
    const a = w.slice(0, 7).filter((v) => v !== null); const b = w.slice(7).filter((v) => v !== null);
    if (a.length >= 2 && b.length >= 2) {
      const avgA = a.reduce((x, y) => x + y, 0) / a.length; const avgB = b.reduce((x, y) => x + y, 0) / b.length;
      const pct = ((avgB - avgA) / avgA) * 100;
      const [lo, hi] = GOALS[p.goal].weekly;
      const kgWeek = avgB - avgA;
      const shown = wt.unit === 'lb' ? `${k1.format(kgWeek / LB)} lb` : `${k1.format(kgWeek)} kg`;
      const adj = Math.round((Math.abs(pct < lo ? lo - pct : pct - hi) / 100) * avgB * 7700 / 7 / 50) * 50; // ≈7700 kcal per kg
      check = h('div', {},
        h('div', { class: 'big' }, `${pct >= 0 ? '+' : ''}${k1.format(pct)}% / week`),
        h('p', { class: 'muted small' }, `${pct >= 0 ? '+' : ''}${shown} this week (7-day average vs the week before). Target: ${lo}% to ${hi}% per week.`),
        h('p', { class: pct < lo || pct > hi ? 'warn' : 'ok' },
          pct < lo ? `Below target. Add about ${Math.max(100, adj)} kcal a day and check again next week.`
            : pct > hi ? `Faster than ideal. Trim about ${Math.max(100, adj)} kcal a day to keep it lean.`
              : '✓ Right on target. Keep going.'));
    }
  }
  out.push(h('article', { class: 'card' }, h('h2', {}, 'Am I on track?'), check));

  if (daily.some(Boolean)) {
    const logged = daily.filter(Boolean);
    const avg = sum(logged); const n = logged.length;
    out.push(h('article', { class: 'card', css: { '--c': '#c08a1e' } },
      h('h2', {}, 'Calories, last 14 days'),
      h('p', { class: 'muted small' }, `Average ${k0.format(avg.kcal / n)} of ${k0.format(t.kcal)} kcal on ${n} logged days.`),
      barChart({ days, values: daily.map((x) => x && x.kcal), color: '#c08a1e', goal: t.kcal, label: 'Calories per day' })));
    out.push(h('article', { class: 'card' },
      h('h2', {}, 'Protein, last 14 days'),
      h('p', { class: 'muted small' }, `Average ${k0.format(avg.p / n)} of ${t.protein} g. Hit on ${daily.filter((x) => x && x.p >= t.protein * 0.95).length} days.`),
      barChart({ days, values: daily.map((x) => x && x.p), color: '#b5523b', goal: t.protein, label: 'Protein per day' })));
  }

  const kg = p.weightKg;
  out.push(h('article', { class: 'card' },
    h('h2', {}, 'Your details'),
    h('p', { class: 'muted small' }, `${p.sex === 'female' ? 'Female' : 'Male'}, ${p.age} · `,
      p.units === 'imperial' ? `${Math.floor(p.heightCm / 30.48)}′${Math.round((p.heightCm / 2.54) % 12)}″ · ${k0.format(kg / LB)} lb` : `${k0.format(p.heightCm)} cm · ${k1.format(kg)} kg`,
      ` · ${ACTIVITY[p.activity]} · ${GOALS[p.goal].label}`),
    h('button', { class: 'btn ghost wide', onclick: editProfile }, 'Update weight, goal or details')));
  return out;
}

      h('option', { value: 'sum', selected: t.agg === 'sum' }, 'Add them up (water, money, steps)'),
      h('option', { value: 'avg', selected: t.agg === 'avg' }, 'Average them (heart rate, temperature)'),
      h('option', { value: 'last', selected: t.agg === 'last' }, 'Keep the latest (weight, sleep)'));
    const goal = h('input', { type: 'number', inputmode: 'decimal', step: 'any', min: 0, value: t.goal ?? '', placeholder: 'Optional' });
    let color = t.color;
    const swatches = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'Color' });
    const paint = () => {
      swatches.replaceChildren(...COLORS.map((c) => h('button', {
        type: 'button', class: `swatch${c === color ? ' on' : ''}`, css: { '--c': c }, role: 'radio', 'aria-checked': String(c === color), 'aria-label': c,
        onclick: () => { color = c; paint(); },
      })));
    };
    paint();
    const numberOnly = h('div', {},
      h('label', { class: 'field' }, h('span', {}, 'Unit'), unit),
      h('label', { class: 'field' }, h('span', {}, 'Several entries in one day'), agg),
      h('label', { class: 'field' }, h('span', {}, 'Daily goal'), goal));
    const sync = () => { numberOnly.hidden = type.value !== 'number'; };
    type.addEventListener('change', sync);
    sync();
    return h('form', {
      class: 'sheet-body',
      onsubmit: (e) => {
        e.preventDefault();
        if (!name.value.trim()) return;
        done({
          ...t,
          id: t.id || uid(),
          name: name.value.trim(),
          type: type.value,
          unit: type.value === 'number' ? unit.value.trim() : '',
          agg: agg.value,
          goal: type.value === 'number' && +goal.value > 0 ? +goal.value : null,
          color,
        });
      },
    },
    h('h2', {}, existing ? 'Edit tracker' : 'New tracker'),
    h('label', { class: 'field' }, h('span', {}, 'Name'), name),
    h('label', { class: 'field' }, h('span', {}, 'Type'), type),
    numberOnly,
    h('div', { class: 'field' }, h('span', {}, 'Color'), swatches),
    h('div', { class: 'row end' },
      h('button', { type: 'button', class: 'btn ghost', onclick: () => done(null) }, 'Cancel'),
      h('button', { type: 'submit', class: 'btn primary' }, existing ? 'Save' : 'Add tracker')));
  });
}

async function addTracker() {
  const t = await trackerDialog(null);
  if (!t) return;
  state.trackers.push(t);
  await commit();
}

async function editTracker(t) {
  const next = await trackerDialog(t);
  if (!next) return;
  if (next.type !== t.type && state.entries.some((e) => e.trackerId === t.id)) {
    const ok = await confirmDialog('Change type?', `${t.name} already has entries. Changing its type keeps the numbers but they may read oddly.`, 'Change');
    if (!ok) return;
  }
  Object.assign(t, next);
  await commit();
}

// ---------- logging ----------
function log(t, value) {
  const ts = curDay === dayKey() ? Date.now() : parseDay(curDay).getTime() + 12 * 3600 * 1000;
  state.entries.push({ id: uid(), trackerId: t.id, day: curDay, value, ts });
}

function dayEntries(t) {
  return state.entries.filter((e) => e.trackerId === t.id && e.day === curDay);
}

async function toggleCheck(t) {
  const existing = dayEntries(t);
  if (existing.length) state.entries = state.entries.filter((e) => !existing.includes(e));
  else log(t, 1);
  await commit();
}

async function setRating(t, v) {
  const existing = dayEntries(t);
  const same = existing.length === 1 && existing[0].value === v;
  state.entries = state.entries.filter((e) => !existing.includes(e));
  if (!same) log(t, v);
  await commit();
}

async function addNumber(t, input) {
  const v = parseFloat(String(input.value).replace(',', '.'));
  if (!Number.isFinite(v)) { input.focus(); return; }
  if (t.agg === 'last') state.entries = state.entries.filter((e) => !(e.trackerId === t.id && e.day === curDay));
  log(t, v);
  await commit();
  toast(`${t.name}: ${formatValue(t, v)} logged`);
}

async function undoLast(t) {
  const list = dayEntries(t).sort((a, b) => b.ts - a.ts);
  if (!list.length) return;
  state.entries = state.entries.filter((e) => e !== list[0]);
  await commit();
  toast('Removed last entry');
}

// ---------- views ----------
function viewToday() {
  const today = dayKey();
  const head = h('header', { class: 'day-nav' },
    h('button', { class: 'icon-btn', 'aria-label': 'Previous day', onclick: () => { curDay = addDays(curDay, -1); render(); } }, '‹'),
    h('div', { class: 'day-title' },
      h('h1', {}, dayLabel(curDay)),
      curDay !== today ? h('button', { class: 'link', onclick: () => { curDay = today; render(); } }, 'Back to today') : null),
    h('button', { class: 'icon-btn', 'aria-label': 'Next day', disabled: curDay >= today, onclick: () => { curDay = addDays(curDay, 1); render(); } }, '›'));

  if (!state.trackers.length) {
    const picked = new Set();
    const addBtn = h('button', {
      class: 'btn primary wide', disabled: true,
      onclick: async () => {
        for (const s of STARTERS.filter((x) => picked.has(x.name))) {
          state.trackers.push({ ...s, id: uid(), unit: s.unit || '', agg: s.agg || 'sum', goal: s.goal || null });
        }
        await commit();
      },
    }, 'Add selected');
    return h('section', {}, head,
      h('div', { class: 'card empty' },
        h('h2', {}, 'What do you want to track?'),
        h('p', { class: 'muted' }, 'Pick a few to start, or make your own. You can change them any time.'),
        h('div', { class: 'chips' }, ...STARTERS.map((s) => h('button', {
          class: 'chip', 'aria-pressed': 'false',
          onclick: (e) => {
            if (picked.has(s.name)) picked.delete(s.name); else picked.add(s.name);
            const on = picked.has(s.name);
            e.currentTarget.classList.toggle('on', on);
            e.currentTarget.setAttribute('aria-pressed', String(on));
            addBtn.disabled = !picked.size;
            addBtn.textContent = picked.size ? `Add ${picked.size} tracker${picked.size > 1 ? 's' : ''}` : 'Add selected';
          },
        }, s.name))),
        addBtn,
        h('button', { class: 'btn ghost wide', onclick: addTracker }, 'Create custom tracker')));
  }

  const cards = state.trackers.map((t) => {
    const entries = dayEntries(t);
    const v = dailyValue(t, entries);
    const card = h('article', { class: 'card tracker', css: { '--c': t.color } });
    const title = h('div', { class: 'tracker-head' },
      h('span', { class: 'dot' }),
      h('h2', {}, t.name),
      h('span', { class: 'value' }, t.type === 'check' ? '' : formatValue(t, v)));
    card.append(title);

    if (t.type === 'check') {
      const { current } = streaks(state, t, today);
      card.append(h('div', { class: 'row' },
        h('button', { class: `toggle${v ? ' on' : ''}`, 'aria-pressed': String(!!v), onclick: () => toggleCheck(t) }, v ? '✓ Done' : 'Mark done'),
        current ? h('span', { class: 'muted small' }, `🔥 ${current}-day streak`) : null));
    } else if (t.type === 'rating') {
      card.append(h('div', { class: 'rating', role: 'group', 'aria-label': `${t.name} rating` },
        ...[1, 2, 3, 4, 5].map((n) => h('button', {
          class: `rate${v === n ? ' on' : ''}`, 'aria-pressed': String(v === n), onclick: () => setRating(t, n),
        }, String(n)))));
    } else {
      const input = h('input', { type: 'text', inputmode: 'decimal', placeholder: t.unit || 'Value', 'aria-label': `${t.name} value`, enterkeyhint: 'done' });
      const form = h('form', { class: 'row log', onsubmit: (e) => { e.preventDefault(); addNumber(t, input); } },
        input,
        h('button', { class: 'btn primary', type: 'submit' }, t.agg === 'sum' ? 'Add' : 'Log'),
        entries.length ? h('button', { class: 'btn ghost', type: 'button', 'aria-label': 'Undo last entry', onclick: () => undoLast(t) }, 'Undo') : null);
      if (t.goal) {
        const pct = Math.min(1, (v || 0) / t.goal);
        card.append(h('div', { class: 'progress', role: 'progressbar', 'aria-valuenow': Math.round(pct * 100), 'aria-valuemin': 0, 'aria-valuemax': 100 },
          h('div', { css: { width: `${pct * 100}%` } })),
        h('p', { class: 'muted small' }, `Goal ${formatValue(t, t.goal)}${pct >= 1 ? ' — reached 🎉' : ''}`));
      }
      card.append(form);
    }
    return card;
  });

  return h('section', {}, head, ...cards,
    h('button', { class: 'btn ghost wide', onclick: addTracker }, '+ Add tracker'));
}

function statTile(label, value) {
  return h('div', { class: 'stat' }, h('div', { class: 'stat-v' }, value), h('div', { class: 'stat-l' }, label));
}

function trendText(t, s) {
  if (s.trend === undefined || Math.abs(s.trend) < 1e-9) return '→ steady';
  const arrow = s.trend > 0 ? '↑' : '↓';
  if (s.trendPct !== null && Number.isFinite(s.trendPct)) return `${arrow} ${Math.round(Math.abs(s.trendPct) * 100)}%`;
  return `${arrow} ${num1.format(Math.abs(s.trend))}`;
}

let insightsSub = 'charts';

function insightsSwitch() {
  return h('div', { class: 'chips seg seg2', role: 'tablist' }, ...[['charts', 'Charts'], ['history', 'History']].map(([k, l]) => h('button', {
    class: `chip${k === insightsSub ? ' on' : ''}`, role: 'tab', 'aria-selected': String(k === insightsSub), onclick: () => { insightsSub = k; render(); },
  }, l)));
}

function viewInsightsTab() {
  const sec = insightsSub === 'history' ? viewHistory() : viewInsights();
  sec.prepend(insightsSwitch());
  return sec;
}

function viewInsights() {
  const today = dayKey();
  const days = dayRange(today, range);
  const chips = h('div', { class: 'chips seg', role: 'tablist' }, ...[7, 30, 90, 365].map((n) => h('button', {
    class: `chip${n === range ? ' on' : ''}`, role: 'tab', 'aria-selected': String(n === range), onclick: () => { range = n; render(); },
  }, { 7: 'Week', 30: 'Month', 90: '3 months', 365: 'Year' }[n])));

  if (!state.trackers.length) {
    return h('section', {}, h('h1', {}, 'Insights'), h('p', { class: 'muted card' }, 'Add a tracker on the Today tab and your charts will show up here.'));
  }

  const cards = state.trackers.map((t) => {
    const vals = series(state, t, days);
    const s = summarize(t, vals);
    const card = h('article', { class: 'card', css: { '--c': t.color } },
      h('div', { class: 'tracker-head' }, h('span', { class: 'dot' }), h('h2', {}, t.name), h('span', { class: 'muted small' }, `${s.n} of ${s.days} days`)));
    if (!s.n) {
      card.append(h('p', { class: 'muted' }, 'Nothing logged in this period yet.'));
      return card;
    }
    if (t.type === 'check') {
      const st = streaks(state, t, today);
      card.append(h('div', { class: 'stats' },
        statTile('Done', `${Math.round(s.rate * 100)}%`),
        statTile('Streak', `${st.current}d`),
        statTile('Best', `${st.best}d`)));
      card.append(heatmap({ days, values: vals, color: t.color, label: `${t.name} calendar` }));
    } else {
      const tiles = [statTile(t.type === 'number' && t.agg === 'sum' ? 'Daily avg' : 'Average', formatValue(t, s.mean))];
      if (t.type === 'number' && t.agg === 'sum') tiles.push(statTile('Total', formatValue(t, s.total)));
      else tiles.push(statTile('Range', `${num1.format(s.min)}–${num1.format(s.max)}`));
      tiles.push(statTile('Trend', trendText(t, s)));
      card.append(h('div', { class: 'stats' }, ...tiles));
      card.append(barChart({ days, values: vals, color: t.color, yMax: t.type === 'rating' ? 5 : undefined, goal: t.goal, label: `${t.name} per day` }));
      if (t.goal) {
        const hit = vals.filter((v) => v !== null && v >= t.goal).length;
        card.append(h('p', { class: 'muted small' }, `Goal reached on ${hit} of ${s.n} logged days.`));
      }
      if (s.n >= 7) {
        card.append(h('h3', {}, 'By weekday'));
        card.append(weekdayChart({ values: byWeekday(days, vals), color: t.color, yMax: t.type === 'rating' ? 5 : undefined, label: `${t.name} by weekday` }));
      }
    }
    return card;
  });

  const rels = correlations(state, days);
  const relCard = state.trackers.length >= 2 ? h('article', { class: 'card' },
    h('h2', {}, 'Connections'),
    rels.length
      ? h('ul', { class: 'rels' }, ...rels.slice(0, 6).map(({ a, b, r, n }) => h('li', {},
        h('span', { class: `badge ${r > 0 ? 'pos' : 'neg'}` }, r > 0 ? '↗' : '↘'),
        h('span', {}, `${describe(a)} tends to come with ${r > 0 ? 'higher' : 'lower'} ${b.name.toLowerCase()}`,
          h('span', { class: 'muted small' }, ` · ${strength(r)}, ${n} days`)))))
      : h('p', { class: 'muted' }, 'Keep logging. Once two trackers share about a week of data, patterns between them show up here.'),
    h('p', { class: 'muted small' }, 'Patterns, not proof: two things moving together doesn’t mean one causes the other.')) : null;

  return h('section', {}, h('h1', {}, 'Insights'), chips, ...cards, relCard);
}

function describe(t) {
  return t.type === 'check' ? `Doing ${t.name.toLowerCase()}` : `Higher ${t.name.toLowerCase()}`;
}
function strength(r) {
  const a = Math.abs(r);
  return a >= 0.7 ? 'strong' : a >= 0.5 ? 'moderate' : 'weak';
}

function viewHistory() {
  const sel = h('select', { 'aria-label': 'Filter by tracker', onchange: (e) => { historyFilter = e.target.value; historyLimit = 100; render(); } },
    h('option', { value: '' }, 'All trackers'),
    ...state.trackers.map((t) => h('option', { value: t.id, selected: t.id === historyFilter }, t.name)));
  const list = state.entries
    .filter((e) => !historyFilter || e.trackerId === historyFilter)
    .sort((a, b) => b.day.localeCompare(a.day) || b.ts - a.ts);
  if (!list.length) return h('section', {}, h('h1', {}, 'History'), sel, h('p', { class: 'muted card' }, 'No entries yet.'));

  const groups = [];
  for (const e of list.slice(0, historyLimit)) {
    if (!groups.length || groups.at(-1).day !== e.day) groups.push({ day: e.day, items: [] });
    groups.at(-1).items.push(e);
  }
  return h('section', {}, h('h1', {}, 'History'), sel,
    ...groups.map((g) => h('div', { class: 'card hist' },
      h('h3', {}, dayLabel(g.day)),
      h('ul', {}, ...g.items.map((e) => {
        const t = tracker(e.trackerId);
        return h('li', { css: { '--c': t.color } },
          h('span', { class: 'dot' }),
          h('span', { class: 'grow' }, t.name),
          h('span', { class: 'value' }, formatValue(t, e.value)),
          h('span', { class: 'muted small' }, new Date(e.ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })),
          h('button', {
            class: 'icon-btn small', 'aria-label': `Delete ${t.name} entry`,
            onclick: async () => {
              if (!await confirmDialog('Delete entry?', `${t.name}: ${formatValue(t, e.value)} on ${dayLabel(e.day)}`, 'Delete', true)) return;
              state.entries = state.entries.filter((x) => x !== e);
              await commit();
            },
          }, '✕'));
      })))),
    list.length > historyLimit ? h('button', { class: 'btn ghost wide', onclick: () => { historyLimit += 200; render(); } }, 'Show more') : null);
}

async function download(name, text, type) {
  // Android app: hand the file to the system "Save to…" picker.
  if (globalThis.PocketStatsAndroid?.save) {
    globalThis.PocketStatsAndroid.save(name, type, text);
    return;
  }
  // Inside the claude.ai web-link version, files go through the viewer's save prompt.
  const saver = globalThis.claude?.use ? await globalThis.claude.use('downloads').catch(() => null) : null;
  if (saver) {
    try {
      await saver.save({ filename: name, data: text });
      toast('Saved');
    } catch (err) {
      if (err?.code !== 'declined') toast("Couldn't save the file here.");
    }
    return;
  }
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = h('a', { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function csvCell(v) {
  let s = String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = `'${s}`; // stop spreadsheet formula injection
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

async function exportCsv() {
  if (!await confirmDialog('Export CSV?', 'CSV files are NOT encrypted. Anyone who gets the file can read it. Keep it somewhere private and delete it when you are done.', 'Export')) return;
  const rows = [['date', 'time', 'tracker', 'type', 'value', 'unit']];
  for (const e of [...state.entries].sort((a, b) => a.ts - b.ts)) {
    const t = tracker(e.trackerId);
    rows.push([e.day, new Date(e.ts).toTimeString().slice(0, 5), t.name, t.type, e.value, t.unit]);
  }
  download(`pocket-stats-${dayKey()}.csv`, rows.map((r) => r.map(csvCell).join(',')).join('\n'), 'text/csv');
}

async function exportBackup() {
  if (!vault.hasPasscode() && !await confirmDialog('Export unencrypted backup?', 'You have no passcode set, so this backup will be readable by anyone who gets the file. Set a passcode first to get an encrypted backup.', 'Export anyway')) return;
  const data = await vault.exportBackup(state);
  download(`pocket-stats-backup-${dayKey()}.json`, JSON.stringify(data), 'application/json');
}

function importBackup() {
  const input = h('input', { type: 'file', accept: '.json,application/json' });
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const obj = JSON.parse(await file.text());
      let pass;
      if (obj?.encrypted) {
        pass = await passcodeDialog('Backup passcode', { hint: 'Enter the passcode that was set when this backup was made.' });
        if (!pass) return;
      }
      let data;
      try { data = await vault.readBackup(obj, pass); } catch (err) {
        toast(err.message.includes('Pocket Stats') ? err.message : 'Wrong passcode or damaged file.');
        return;
      }
      const next = normalize(data);
      if (!await confirmDialog('Replace current data?', `The backup has ${next.trackers.length} trackers and ${next.entries.length} entries. Everything currently in the app will be replaced.`, 'Replace', true)) return;
      state = next;
      await commit();
      toast('Backup restored');
    } catch {
      toast("That file couldn't be read.");
    }
  });
  input.click();
}

async function setPasscode() {
  if (!vault.cryptoAvailable()) { toast('Encryption needs the app to be opened over https.'); return; }
  if (vault.hasPasscode()) {
    const cur = await passcodeDialog('Current passcode');
    if (!cur) return;
    if (!await vault.verify(cur)) { toast('Wrong passcode'); return; }
  }
  const pass = await passcodeDialog(vault.hasPasscode() ? 'New passcode' : 'Set a passcode', {
    confirm: true,
    hint: 'Your data will be encrypted with this. There is no recovery: if you forget it, the only option is to erase everything.',
  });
  if (!pass) return;
  toast('Encrypting…');
  await vault.setPasscode(pass, state);
  toast('Passcode set. Data encrypted.');
  render();
}

async function removePasscode() {
  const cur = await passcodeDialog('Current passcode', { hint: 'Removing the passcode stores your data unencrypted on this phone.' });
  if (!cur) return;
  if (!await vault.verify(cur)) { toast('Wrong passcode'); return; }
  await vault.removePasscode(state);
  toast('Passcode removed');
  render();
}

async function eraseAll() {
  if (!await confirmDialog('Erase everything?', 'All trackers and entries will be permanently deleted from this phone. This cannot be undone.', 'Erase', true)) return;
  await vault.wipe();
  state = freshState();
  await vault.save(state);
  curDay = dayKey();
  view = 'today';
  toast('All data erased');
  render();
}

function moveTracker(i, d) {
  const j = i + d;
  if (j < 0 || j >= state.trackers.length) return;
  [state.trackers[i], state.trackers[j]] = [state.trackers[j], state.trackers[i]];
  commit();
}

async function deleteTracker(t) {
  const n = state.entries.filter((e) => e.trackerId === t.id).length;
  if (!await confirmDialog(`Delete ${t.name}?`, n ? `This also deletes its ${n} entries.` : null, 'Delete', true)) return;
  state.trackers = state.trackers.filter((x) => x !== t);
  state.entries = state.entries.filter((e) => e.trackerId !== t.id);
  if (historyFilter === t.id) historyFilter = '';
  await commit();
}

function viewSettings() {
  const locked = vault.hasPasscode();
  const autoLock = h('select', {
    'aria-label': 'Auto-lock',
    onchange: (e) => { state.settings.autoLock = +e.target.value; commit(); },
  }, ...[[0, 'Immediately'], [1, 'After 1 minute'], [5, 'After 5 minutes'], [15, 'After 15 minutes'], [-1, 'Never']]
    .map(([v, l]) => h('option', { value: v, selected: state.settings.autoLock === v }, l)));

  const persist = h('span', { class: 'muted small' }, 'Checking…');
  navigator.storage?.persisted?.().then((p) => {
    persist.textContent = p ? 'Protected from automatic cleanup' : 'The browser may clear it if storage runs low. Add the app to your home screen to keep it safe.';
  }).catch(() => { persist.textContent = ''; });

  return h('section', {}, h('h1', {}, 'Settings'),
    h('article', { class: 'card' },
      h('h2', {}, 'Trackers'),
      state.trackers.length ? h('ul', { class: 'manage' }, ...state.trackers.map((t, i) => h('li', { css: { '--c': t.color } },
        h('span', { class: 'dot' }),
        h('span', { class: 'grow' }, t.name, h('span', { class: 'muted small' }, ` · ${TYPES[t.type]}`)),

        h('button', { class: 'icon-btn small', 'aria-label': `Move ${t.name} down`, disabled: i === state.trackers.length - 1, onclick: () => moveTracker(i, 1) }, '↓'),
        h('button', { class: 'icon-btn small', 'aria-label': `Edit ${t.name}`, onclick: () => editTracker(t) }, '✎'),
        h('button', { class: 'icon-btn small', 'aria-label': `Delete ${t.name}`, onclick: () => deleteTracker(t) }, '✕'))))
        : h('p', { class: 'muted' }, 'No trackers yet.'),
      h('button', { class: 'btn ghost wide', onclick: addTracker }, '+ Add tracker')),

    h('article', { class: 'card' },
      h('h2', {}, 'Lock & encryption'),
      h('p', { class: locked ? 'ok' : 'muted' }, locked
        ? '🔒 Locked with a passcode. Your data is encrypted on this phone (AES-256).'
        : 'No passcode. Anyone holding your unlocked phone could open the app.'),
      locked ? h('label', { class: 'field' }, h('span', {}, 'Lock when I leave the app'), autoLock) : null,
