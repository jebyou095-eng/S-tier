<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Strict privacy: nothing loads from anywhere except this app, and the page can make no network requests. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; manifest-src 'self'; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pocket Stats">
  <title>Pocket Stats</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <nav id="tabs" class="tabs" hidden></nav>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="noscript">Pocket Stats needs JavaScript to run. It still sends nothing anywhere.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
